
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUIWIN GAME</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#05080d;color:white;
  font-family:Arial,sans-serif;text-align:center;
  background-image:radial-gradient(ellipse at top,#103526,transparent 65%);
}
.card{
  width:100%;max-width:360px;padding:28px 20px;
  border:1px solid #35ff9160;border-radius:22px;
  background:#0b111bee;box-shadow:0 0 35px #35ff9115;
}
.logo{
  width:95px;height:95px;object-fit:cover;border-radius:50%;
  border:3px solid #35ff91;box-shadow:0 0 22px #35ff9144;
}
h1{font-size:27px;margin:18px 0 8px;font-weight:900}
h1 span{color:#35ff91}
p{font-size:14px;line-height:1.6;color:#b8c4d4;margin:10px 0 20px}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 24px}
.tags span{
  padding:9px 12px;border-radius:9px;background:#131f29;
  border:1px solid #ffffff14;font-size:12px;color:#35ff91;font-weight:bold;
}
.join{
  display:block;padding:16px 10px;border-radius:11px;
  background:linear-gradient(100deg,#16bf69,#35ff91);
  color:#03150b;text-decoration:none;font-weight:900;font-size:16px;
  box-shadow:0 0 22px #35ff9130;animation:pulse 1.7s infinite;
}
small{display:block;color:#8493a7;margin-top:17px;font-size:11px}
@keyframes pulse{50%{box-shadow:0 0 28px #35ff9170}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<!-- META PIXEL -->
<script>
!function(f,b,e,v,n,t,s){
if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;
s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

fbq('init','YOUR_PIXEL_ID');
fbq('track','PageView');
</script>
</head>

<body>
<div class="card">
  <img class="logo" src="assets/profile-photo.jpg" alt="Gaming Logo">

  <h1>PR <span>GAMING</span></h1>
  <p>🎮 Gaming Updates • Esports • Tips & Tricks</p>

  <div class="tags">
    <span>🔥 Color Trading</span>
    <span>🎯 Casino</span>
    <span>🏆 Betting</span>
  </div>

  <a class="join" id="joinBtn"
     href="https://t.me/" target="_blank"
     rel="noopener noreferrer">✈ JOIN TELEGRAM ➜</a>

  <small>Gaming Community • APEagency</small>
</div>

<script>
document.getElementById('joinBtn').addEventListener('click',function(){
  if(typeof fbq==='function'){
    fbq('track','Lead',{content_name:'Gaming Telegram Join'});
  }
});
</script>
</body>
</html>
